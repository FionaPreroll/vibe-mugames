<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Delay step: the drawn puck against an even drawing</title>
<desc id="d">How far along the rink a phone draws the puck from where the host had it at the steady lag, from second 8 to 12, without smoothing and with the default Kalman filter. Zero is a perfectly even drawing.</desc>
