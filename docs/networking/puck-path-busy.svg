<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Busy Wi-Fi: the puck along the rink, close up</title>
<desc id="d">The puck’s place along the rink as a phone draws it, over half a second of busy Wi-Fi, without smoothing and with the default Kalman filter, against where the host had it at the steady lag.</desc>
<style>
  .surface { fill: #fcfcfb }
  .title { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
  .text { fill: #52514e; font: 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
  .label { fill: #0b0b0b; font: 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
  .grid { stroke: #e7e6e2; stroke-width: 1 }
  .axis { stroke: #b9b8b2; stroke-width: 1 }
  .s1 { stroke: #2a78d6; fill: #2a78d6 }
  .s2 { stroke: #eb6834; fill: #eb6834 }
  .s3 { stroke: #1baf7a; fill: #1baf7a }
  .s4 { stroke: #eda100; fill: #eda100 }
  .sreference { stroke: #8a8984; fill: #8a8984 }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19 }
    .title, .label { fill: #f0efec }
    .text { fill: #c3c2b7 }
    .grid { stroke: #2f2e2b }
    .axis { stroke: #57564f }
    .s1 { stroke: #3987e5; fill: #3987e5 }
    .s2 { stroke: #d95926; fill: #d95926 }
    .s3 { stroke: #199e70; fill: #199e70 }
    .s4 { stroke: #c98500; fill: #c98500 }
    .sreference { stroke: #8f8e88; fill: #8f8e88 }
  }
  /* After the colours, so that a line's colour never fills it. */
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round }
</style>
<rect class="surface" width="760" height="360" rx="8"/>
<text class="title" x="64" y="26">Busy Wi-Fi: the puck along the rink, close up</text>
<line class="line sreference" x1="64" y1="48" x2="80" y2="48"/>
<text class="text" x="86" y="52">Host, at the steady lag</text>
<line class="line s1" x1="245.79999999999998" y1="48" x2="261.79999999999995" y2="48"/>
<text class="text" x="267.79999999999995" y="52">Unfiltered</text>
<line class="line s2" x1="341.79999999999995" y1="48" x2="357.79999999999995" y2="48"/>
<text class="text" x="363.79999999999995" y="52">Kalman (default, q = 10⁻⁴)</text>
