<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">How unevenly the host’s time is drawn</title>
<desc id="d">For each network and method: how far the drawn host time jumps from frame to frame beyond the frame’s own length, as RMS in milliseconds. Lower is smoother.</desc>
<style>
  .surface { fill: #fcfcfb }
  .title { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
  .text { fill: #52514e; font: 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
  .label { fill: #0b0b0b; font: 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
  .grid { stroke: #e7e6e2; stroke-width: 1 }
  .axis { stroke: #b9b8b2; stroke-width: 1 }
  .s1 { stroke: #2a78d6; fill: #2a78d6 }
  .s2 { stroke: #eb6834; fill: #eb6834 }
  .s3 { stroke: #1baf7a; fill: #1baf7a }
  .s4 { stroke: #eda100; fill: #eda100 }
  .sreference { stroke: #8a8984; fill: #8a8984 }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19 }
    .title, .label { fill: #f0efec }
    .text { fill: #c3c2b7 }
    .grid { stroke: #2f2e2b }
    .axis { stroke: #57564f }
    .s1 { stroke: #3987e5; fill: #3987e5 }
    .s2 { stroke: #d95926; fill: #d95926 }
    .s3 { stroke: #199e70; fill: #199e70 }
    .s4 { stroke: #c98500; fill: #c98500 }
    .sreference { stroke: #8f8e88; fill: #8f8e88 }
  }
  /* After the colours, so that a line's colour never fills it. */
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round }
</style>
