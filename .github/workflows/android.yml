name: Android

# Builds the Android app (Capacitor) as an installable debug APK, on every push to main and every
# pull request, or by hand from the Actions tab. The APK is kept as the run's artifact; from main,
# it also goes to the release "Spielekiste for Android", at a download link that never changes:
# https://github.com/FionaPreroll/vibe-mugames/releases/latest/download/spielekiste.apk
# Beside it, version.json names the build, for the app's in-app updates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        # The version, the build number and the commit, as Android shows the app's version.
        run: |
          VERSION_NAME="$(node -p "require('../package.json').version")-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" \
            ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk spielekiste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spielekiste-apk
          path: spielekiste.apk
          retention-days: 30
          if-no-files-found: error

  release:
    # Builds of main only: pull requests and runs on other branches publish nothing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: android-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: spielekiste-apk
      - name: Skip if main has moved on, or a newer build is out
        id: current
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          # The build in the release now: a run started later may have finished first, and an
          # older build must not replace it. Releases before version.json name it in their notes.
          published=$(gh release download "$TAG" --pattern version.json --output - 2>/dev/null |
            node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              try { console.log(Number(JSON.parse(s).build) || 0) } catch { console.log(0) } })')
          if [ "${published:-0}" = 0 ]; then
            published=$(gh release view "$TAG" --json body --jq .body 2>/dev/null |
              sed -n 's/.*(build \([0-9]*\)).*/\1/p' | head -1)
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now; its own run publishes that build instead."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "${published:-0}" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "::notice::Build $published is out already, newer than this build $GITHUB_RUN_NUMBER."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        if: steps.current.outputs.publish == 'true'
        run: |
          cat > notes.md <<NOTES
          The newest build of the Spielekiste for Android, from commit ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). This release is replaced with every change to \`main\`.

          **Installing:** download \`spielekiste.apk\` below and open it on the phone; Android asks once to allow installing apps from that source. A newer APK installs over an older one and keeps the app's settings, and the app can look for a newer build and install it itself.

          This is a debug build, signed with the project's debug key: for testing and playing with friends, not for the Play Store.
          NOTES
          # What the app compares with its own build number to find updates (@fionapreroll/app-updates).
          printf '{"build":%s,"commit":"%s","size":%s}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(stat -c %s spielekiste.apk)" > version.json
          # The tag follows main: it always names the commit of the APK in the release.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" spielekiste.apk version.json --clobber
            gh release edit "$TAG" --title "Spielekiste for Android" --notes-file notes.md --latest
          else
            gh release create "$TAG" spielekiste.apk version.json --title "Spielekiste for Android" --notes-file notes.md --latest
          fi
